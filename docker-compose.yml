services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/jobflow
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/uploads
    depends_on:
      - mongo
      - redis
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo_data:
  uploads:
